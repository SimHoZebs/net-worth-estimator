services:
  casdoor:
    image: casbin/casdoor:v4.23.0@sha256:e13c9aada231f7338a03ab0ae7054d0a9480e77283338ab9fc319d88fe2b3ce0
    user: "${CASDOOR_UID:-1000}:${CASDOOR_GID:-1000}"
    restart: unless-stopped
    ports:
      - "${CASDOOR_BIND:-127.0.0.1}:${CASDOOR_PORT:-8000}:8000"
    volumes:
      - ${CASDOOR_STATE_DIR:-./data}/conf:/conf:ro
      - ${CASDOOR_STATE_DIR:-./data}/db:/data
      # Casdoor v4.23.0 hard-codes its file session provider to ./tmp.
      - ${CASDOOR_STATE_DIR:-./data}/sessions:/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12
