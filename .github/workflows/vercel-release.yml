name: Deploy frontend to Vercel

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: vercel-release
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.VERCEL_PROJECT_ID != '' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify the tested commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          TESTS_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TESTS_EVENT: ${{ github.event.workflow_run.event }}
          TESTS_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DISPATCH_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const sha = process.env.RELEASE_SHA;
          if (!/^[a-f0-9]{40}$/.test(sha || "")) throw new Error("A full release SHA is required");

          if (process.env.EVENT_NAME === "workflow_run") {
            if (process.env.TESTS_CONCLUSION !== "success" ||
                process.env.TESTS_EVENT !== "push" ||
                process.env.TESTS_BRANCH !== "main") {
              throw new Error("The Tests workflow run is not a green push to main");
            }
          } else if (process.env.EVENT_NAME === "workflow_dispatch") {
            if (process.env.DISPATCH_REF !== "refs/heads/main") throw new Error("Manual dispatch only releases main");
            const api = process.env.GITHUB_API_URL ?? "https://api.github.com";
            const query = new URLSearchParams({ head_sha: sha, status: "completed", per_page: "100" });
            const response = await fetch(`${api}/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?${query}`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" },
            });
            if (!response.ok) throw new Error(`Cannot read Tests runs (HTTP ${response.status})`);
            const runs = (await response.json()).workflow_runs ?? [];
            const green = runs.some((run) =>
              run.conclusion === "success" && run.event === "push" && run.head_branch === "main");
            if (!green) throw new Error(`No successful main Tests run for ${sha}`);
          } else {
            throw new Error("Unsupported release event");
          }
          console.log(`Tests passed for ${sha}.`);
          JS

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Deploy the tested commit to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          node --input-type=module <<'JS'
          const teamId = process.env.VERCEL_ORG_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          const token = process.env.VERCEL_TOKEN;
          const sha = process.env.RELEASE_SHA;
          if (!/^[a-f0-9]{40}$/.test(sha || "")) throw new Error("A full release SHA is required");
          if (!teamId || !projectId || !token) throw new Error("Vercel deployment settings are incomplete");

          const headers = { Authorization: `Bearer ${token}`, Accept: "application/json" };
          const projectResponse = await fetch(`https://api.vercel.com/v9/projects/${projectId}?teamId=${teamId}`, { headers });
          if (!projectResponse.ok) throw new Error(`Cannot read the Vercel project (HTTP ${projectResponse.status})`);
          const project = await projectResponse.json();
          const repoId = project.link?.repoId;
          if (!repoId) throw new Error("The Vercel project has no GitHub repository link");

          const createResponse = await fetch(`https://api.vercel.com/v13/deployments?teamId=${teamId}&forceNew=1`, {
            method: "POST",
            headers: { ...headers, "Content-Type": "application/json" },
            body: JSON.stringify({
              name: project.name,
              project: projectId,
              target: "production",
              gitSource: { type: "github", repoId, ref: "main", sha },
            }),
          });
          const created = await createResponse.json();
          if (!createResponse.ok) throw new Error(`Vercel rejected the deployment (HTTP ${createResponse.status}): ${created.error?.message ?? "unknown error"}`);
          console.log(`Created ${created.id} for ${sha} at ${created.url}.`);

          const deadline = Date.now() + 40 * 60 * 1000;
          while (Date.now() < deadline) {
            await new Promise((resolve) => setTimeout(resolve, 10000));
            const response = await fetch(`https://api.vercel.com/v13/deployments/${created.id}?teamId=${teamId}`, { headers });
            if (!response.ok) throw new Error(`Cannot read the deployment (HTTP ${response.status})`);
            const deployment = await response.json();
            if (deployment.readyState === "READY") {
              console.log(`Deployment ${created.id} is ready at ${deployment.url}.`);
              process.exit(0);
            }
            if (deployment.readyState === "ERROR" || deployment.readyState === "CANCELED") {
              throw new Error(`Deployment ${created.id} ended in ${deployment.readyState}: ${deployment.error?.message ?? "no error message"}`);
            }
          }
          throw new Error("Deployment did not finish within 40 minutes");
          JS
