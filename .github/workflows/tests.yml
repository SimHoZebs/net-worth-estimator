name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A same-repository pull request reuses the branch push run for the same
  # commit. Forks still get a pull_request run because their pushes never
  # reach this repository.
  group: tests-${{ github.event.pull_request.head.sha || github.sha }}
  # A same-repository PR run is skipped and must not cancel the branch push
  # run it reuses. Push runs keep cancellation for same-commit re-runs; each
  # new commit gets its own group.
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          code="$(bash scripts/ci-changed-paths.sh)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Changed paths need code gates: $code" >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend tests
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Run backend gates
        run: backend/scripts/verify.sh
      - name: Verify offline payment-pattern upgrade
        run: python3 -B -m unittest discover -s backend/scripts/one-time/payment-patterns -v

  ml:
    name: ML service tests
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Python runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ml/Dockerfile
          load: true
          tags: ml-test
          cache-from: type=gha,scope=ml-test
          # Merge-ref caches are throwaway, so only main persists layers.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=ml-test' || '' }}
      - name: Verify shared learning and durable feedback
        run: docker run --rm --network none ml-test python -B -m unittest discover -s /app -p 'test_*.py' -v
      - name: Verify Northflank process composition
        run: python3 -B -m unittest discover -s deploy/northflank -p 'test_*.py' -v
      - name: Build the Northflank deployment target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: northflank
          load: true
          tags: northflank-ml-test
          cache-from: type=gha,scope=northflank-test
          # Merge-ref caches are throwaway, so only main persists layers.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=northflank-test' || '' }}
      - name: Verify the constrained deployment
        run: NORTHFLANK_TEST_IMAGE=northflank-ml-test node --test deploy/northflank/container.test.mjs
      - name: Verify offline migration in the deployment image
        run: DEPLOYMENT_TEST_IMAGE=northflank-ml-test node --test --test-name-pattern 'API image migrates' deploy/migrations.test.mjs
      - name: Build the standalone deployment image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: waypoint-deployment-test
          cache-from: type=gha,scope=deployment-test
          # Merge-ref caches are throwaway, so only main persists layers.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=deployment-test' || '' }}
      - name: Verify the standalone deployment image
        run: DEPLOYMENT_TEST_IMAGE=waypoint-deployment-test node --test deploy/container.test.mjs

  gate:
    name: Frontend and static gates
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '.bun-version') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the completion gate
        env:
          KEEP_GATE_LOGS: "1"
          TMPDIR: ${{ github.workspace }}/tmp/gate
        run: |
          mkdir -p "$TMPDIR"
          scripts/test --gate --no-browser --without-backend
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-artifacts
          path: tmp/gate
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Integration tests (shard ${{ matrix.shard }}/4)
    needs: changes
    # A false job-level if stops the matrix before expansion, so the four
    # required shard check names would never be reported. Keep the job
    # eligible and gate its steps instead.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # The runner sees an explicit Playwright shard and starts one fixture
      # backend plus one Vite server for this job only.
      TEST_BROWSER_SHARDS: 1
    steps:
      - name: Gate this shard
        id: gate
        env:
          RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          EVENT_NAME: ${{ github.event_name }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if [ "$RESULT" != "success" ]; then
            echo "Classification did not succeed: $RESULT" >&2
            exit 1
          fi
          case "$CODE" in
            true|false) ;;
            *) echo "Invalid classification output: '$CODE'" >&2; exit 1 ;;
          esac
          if [ "$CODE" = "true" ] && { [ "$EVENT_NAME" != "pull_request" ] || [ "$FORK" = "true" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.gate.outputs.run == 'true'
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Cache Bun packages
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '.bun-version') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Cache Playwright browsers
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Install Chromium
        if: steps.gate.outputs.run == 'true'
        working-directory: frontend
        # The hosted Ubuntu image already carries Chromium's libraries.
        # Avoiding --with-deps prevents a slow font download from dominating.
        run: bunx --no-install playwright install chromium
      - name: Run integration shard
        if: steps.gate.outputs.run == 'true'
        run: bun --filter ./frontend test:integration -- --shard=${{ matrix.shard }}/4
      - name: Upload failure artifacts
        if: steps.gate.outputs.run == 'true' && failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-artifacts-shard-${{ matrix.shard }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  extension:
    name: Extension browser tests
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '.bun-version') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: extension
        # The hosted Ubuntu image already carries Chromium's libraries.
        # Avoiding --with-deps prevents a slow font download from dominating.
        run: bunx --no-install playwright install chromium
      - name: Run extension browser tests
        run: bun --filter ./extension test:browser
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-artifacts
          path: extension/test-results
          if-no-files-found: ignore
          retention-days: 7
