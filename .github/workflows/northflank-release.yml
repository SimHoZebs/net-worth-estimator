name: Request Northflank release

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: northflank-release
  cancel-in-progress: false

jobs:
  request-release:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Verify the tested commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          TESTS_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TESTS_EVENT: ${{ github.event.workflow_run.event }}
          TESTS_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DISPATCH_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          const sha = process.env.RELEASE_SHA;
          if (!/^[a-f0-9]{40}$/.test(sha || "")) throw new Error("A full release SHA is required");

          if (process.env.EVENT_NAME === "workflow_run") {
            if (process.env.TESTS_CONCLUSION !== "success" ||
                process.env.TESTS_EVENT !== "push" ||
                process.env.TESTS_BRANCH !== "main") {
              throw new Error("The Tests workflow run is not a green push to main");
            }
          } else if (process.env.EVENT_NAME === "workflow_dispatch") {
            if (process.env.DISPATCH_REF !== "refs/heads/main") throw new Error("Manual dispatch only releases main");
            const api = process.env.GITHUB_API_URL ?? "https://api.github.com";
            const query = new URLSearchParams({ head_sha: sha, status: "completed", per_page: "100" });
            const response = await fetch(`${api}/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?${query}`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" },
            });
            if (!response.ok) throw new Error(`Cannot read Tests runs (HTTP ${response.status})`);
            const runs = (await response.json()).workflow_runs ?? [];
            const green = runs.some((run) =>
              run.conclusion === "success" && run.event === "push" && run.head_branch === "main");
            if (!green) throw new Error(`No successful main Tests run for ${sha}`);
          } else {
            throw new Error("Unsupported release event");
          }
          console.log(`Tests passed for ${sha}.`);
          JS

      - name: Wait for the pinned images
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          const sha = process.env.RELEASE_SHA;
          if (!/^[a-f0-9]{40}$/.test(sha || "")) throw new Error("A full release SHA is required");
          const repository = process.env.GITHUB_REPOSITORY.toLowerCase();
          const names = [`${repository}-backend-northflank`, `${repository}-auth`];
          const tag = `sha-${sha}`;
          const interval = Number(process.env.IMAGE_POLL_INTERVAL_MS ?? 5000);
          const deadline = Date.now() + Number(process.env.IMAGE_POLL_TIMEOUT_MS ?? 30 * 60 * 1000);

          async function manifest(name) {
            try {
              const tokenResponse = await fetch(`https://ghcr.io/token?scope=repository:${name}:pull&service=ghcr.io`);
              if (!tokenResponse.ok) return { ok: false, status: tokenResponse.status };
              const { token } = await tokenResponse.json();
              const response = await fetch(`https://ghcr.io/v2/${name}/manifests/${tag}`, {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json",
                },
              });
              return { ok: response.ok, status: response.status };
            } catch {
              return { ok: false, status: 0 };
            }
          }

          while (Date.now() < deadline) {
            const results = await Promise.all(names.map(manifest));
            if (results.every((result) => result.ok)) {
              console.log(`Published images are ready for ${sha}.`);
              process.exit(0);
            }
            const denied = names.find((_, index) => [401, 403].includes(results[index].status));
            if (denied) throw new Error(`Image ${denied}:${tag} is not anonymously readable; make the package public or configure a registry credential`);
            await new Promise((resolve) => setTimeout(resolve, interval));
          }
          throw new Error(`Pinned images for ${sha} were not published before the deadline`);
          JS

      - name: Request the release
        env:
          RELEASE_WEBHOOK: ${{ secrets.NORTHFLANK_RELEASE_WEBHOOK }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IDENTITY_SERVICE_ID: ${{ vars.NORTHFLANK_IDENTITY_SERVICE_ID }}
          IDENTITY_DATABASE_ADDON_ID: ${{ vars.NORTHFLANK_IDENTITY_DATABASE_ADDON_ID }}
        run: |
          node --input-type=module <<'JS'
          const sha = process.env.RELEASE_SHA;
          if (!/^[a-f0-9]{40}$/.test(sha || "")) throw new Error("A full release SHA is required");
          const repository = process.env.GITHUB_REPOSITORY.toLowerCase();
          const apiImage = `ghcr.io/${repository}-backend-northflank:sha-${sha}`;
          const identityImage = `ghcr.io/${repository}-auth:sha-${sha}`;
          const identityService = process.env.IDENTITY_SERVICE_ID;
          const identityDatabase = process.env.IDENTITY_DATABASE_ADDON_ID;
          if (!identityService || !identityDatabase) throw new Error("Prepared identity service and database IDs are required");

          const raw = process.env.RELEASE_WEBHOOK;
          let url;
          try { url = new URL(raw); } catch { throw new Error("Release webhook is not configured"); }
          if (url.protocol !== "https:" || url.hostname !== "webhooks.northflank.com" ||
              url.username || url.password || url.search || url.hash ||
              !url.pathname.startsWith("/workflows/")) {
            throw new Error("Unexpected release webhook target");
          }
          url.searchParams.set("RELEASE_SHA", sha);
          url.searchParams.set("API_IMAGE", apiImage);
          url.searchParams.set("IDENTITY_IMAGE", identityImage);
          url.searchParams.set("IDENTITY_SERVICE_ID", identityService);
          url.searchParams.set("IDENTITY_DATABASE_ADDON_ID", identityDatabase);
          url.searchParams.set("name", `main-${sha.slice(0, 12)}`);
          let response;
          try {
            response = await fetch(url, { method: "POST", redirect: "error", signal: AbortSignal.timeout(60000) });
          } catch {
            throw new Error("Northflank release request failed. Northflank may still have accepted the release, so check its workflow runs before requesting it again.");
          }
          if (!response.ok) throw new Error(`Northflank did not confirm the release request (HTTP ${response.status}). It may still have accepted the release, so check its workflow runs before requesting it again.`);
          console.log(`Requested Northflank workflow for ${sha} with pinned images. Track completion in Northflank.`);
          JS
