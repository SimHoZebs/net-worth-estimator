name: Publish container images

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            file: backend/Dockerfile
            target: ''
          - image: frontend
            context: .
            file: frontend/Dockerfile
            target: ''
          - image: auth
            context: .
            file: auth/better-auth/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # Reuse compares the release commit with the last commit that has a
          # published image for this component.
          fetch-depth: 0
          persist-credentials: false
      - name: Image reference
        id: image
        env:
          COMPONENT: ${{ matrix.image }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select a reusable image
        id: reuse
        if: github.event_name == 'workflow_run'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMPONENT: ${{ matrix.image }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            backend)
              paths=(backend deploy/migrate.sh deploy/analysis-schema.sql)
              ;;
            frontend)
              paths=(frontend package.json bun.lock extension/package.json)
              ;;
            auth)
              paths=(auth/better-auth .dockerignore package.json bun.lock frontend/package.json extension/package.json frontend/src/styles frontend/src/components/brandStyles.ts frontend/src/components/buttonStyles.ts frontend/src/components/fieldStyles.ts)
              ;;
            *)
              echo "unknown image component: $COMPONENT" >&2
              exit 1
              ;;
          esac

          source=""
          commits="$(git rev-list --max-count=20 "$HEAD_SHA^" 2>/dev/null || true)"
          while read -r commit; do
            [ -n "$commit" ] || continue
            if docker buildx imagetools inspect "$IMAGE:sha-$commit" >/dev/null 2>&1; then
              source="$commit"
              break
            fi
          done <<< "$commits"

          if [ -n "$source" ] && [ -z "$(git diff --name-only "$source" "$HEAD_SHA" -- "${paths[@]}")" ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "source=$source" >> "$GITHUB_OUTPUT"
            echo "Reusing \`${IMAGE}:sha-${source}\` for \`${HEAD_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reuse the unchanged image
        id: reused
        if: steps.reuse.outputs.reuse == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_SHA: ${{ steps.reuse.outputs.source }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:sha-$HEAD_SHA" "$IMAGE:sha-$SOURCE_SHA"
          digest="$(docker buildx imagetools inspect --raw "$IMAGE:sha-$HEAD_SHA" | sha256sum | cut -d' ' -f1)"
          echo "digest=sha256:$digest" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        id: publish
        if: steps.reuse.outputs.reuse != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record immutable image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest || steps.reused.outputs.digest }}
        run: echo "\`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
