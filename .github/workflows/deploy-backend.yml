# Deploys the Go backend to Northflank after green CI on main.
#
# How it works:
#   1. The `CI` workflow verifies every push/PR (lint, typecheck, tests, build).
#   2. When `CI` completes successfully on main, this workflow builds the
#      backend Docker image, pushes it to GHCR, and tells Northflank to roll
#      the deployment service to the new image.
#   3. Pushes that touch no backend inputs skip everything (no pod recycle).
#
# One-time setup (see README "Deploy The Backend To Northflank"):
#   GitHub secrets:   NORTHFLANK_API_KEY (Update Deployment permission)
#   GitHub variables: NORTHFLANK_PROJECT_ID, NORTHFLANK_SERVICE_ID,
#                     NORTHFLANK_CREDENTIALS_ID (GHCR registry credentials id)
#   Northflank:       backend as a *deployment* service from GHCR (port 8787,
#                     /healthz check, persistent volume on /data, 1 instance).
name: Deploy backend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check for backend changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -Eq '^(backend/|public/configs/|public/data/income/|Dockerfile$|\.github/workflows/deploy-backend\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lowercase image name
        if: steps.changes.outputs.backend == 'true'
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/net-worth-estimator-server" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.changes.outputs.backend == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: steps.changes.outputs.backend == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.image.outputs.name }}:latest

      - name: Deploy to Northflank
        if: steps.changes.outputs.backend == 'true'
        uses: northflank/deploy-to-northflank@v1
        with:
          northflank-api-key: ${{ secrets.NORTHFLANK_API_KEY }}
          project-id: ${{ vars.NORTHFLANK_PROJECT_ID }}
          service-id: ${{ vars.NORTHFLANK_SERVICE_ID }}
          image-path: ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          credentials-id: ${{ vars.NORTHFLANK_CREDENTIALS_ID }}
