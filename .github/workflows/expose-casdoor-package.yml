name: Expose Casdoor package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  expose:
    runs-on: ubuntu-latest
    steps:
      - name: Make the Casdoor container package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          repo="${GITHUB_REPOSITORY}"
          name="net-worth-estimator-casdoor"
          echo "--- repository package endpoint"
          gh api --method PATCH "/repos/${repo}/packages/container/${name}" -f visibility=public || true
          echo "--- user visibility endpoint"
          gh api --method PATCH "/user/packages/container/${name}/visibility" -f visibility=public || true
          echo "--- user package endpoint"
          gh api --method PATCH "/user/packages/container/${name}" -f visibility=public || true
          echo "--- read back"
          gh api "/repos/${repo}/packages/container/${name}" --jq '{name,visibility}' || true
