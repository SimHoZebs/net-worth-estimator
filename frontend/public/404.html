<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="refresh" content="5;url=/" />
		<title>Not found · Waypoint</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					sans-serif;
				background: #101510;
				color: #e8ece4;
			}
			main {
				text-align: center;
				padding: 24px;
				max-width: 420px;
			}
			h1 {
				font-size: 28px;
				margin: 0 0 8px;
			}
			p {
				margin: 0 0 16px;
				color: #aab3a4;
				font-size: 14px;
				line-height: 1.6;
			}
			a {
				color: #9dbd7d;
				font-size: 14px;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Page not found</h1>
			<p>
				This link does not match anything. Sending you back to the plan in a few
				seconds.
			</p>
			<a href="/">Back to the plan now</a>
		</main>
		<script>
			// Preserve the app route when one is present: an unknown path with
			// a valid hash (for example /bogus#accounts/demo) still lands in
			// the app instead of dropping the location.
			window.setTimeout(function () {
				window.location.replace("/" + window.location.hash);
			}, 4000);
		</script>
	</body>
</html>
