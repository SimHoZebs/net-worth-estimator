<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta id="theme-color" name="theme-color" content="#214c3d" />
		<meta id="color-scheme" name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="Understand your household's financial trajectory. Explore your plan, inspect the evidence, and make considered changes."
		/>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<title>Waypoint · Your financial outlook</title>
		<script>
			try {
				var stored = "system";
				var raw = localStorage.getItem("waypoint-theme");
				if (raw === "light" || raw === "dark" || raw === "system")
					stored = raw;
				var dark =
					stored === "dark" ||
					(stored === "system" &&
						window.matchMedia("(prefers-color-scheme: dark)").matches);
				var colorScheme = document.getElementById("color-scheme");
				if (colorScheme)
					colorScheme.setAttribute(
						"content",
						stored === "system" ? "light dark" : stored,
					);
				var themeColor = document.getElementById("theme-color");
				if (themeColor)
					themeColor.setAttribute(
						"content",
						dark ? "#0f1411" : "#214c3d",
					);
			} catch (e) {
				var fallback = document.getElementById("color-scheme");
				if (fallback) fallback.setAttribute("content", "light dark");
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
