<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#214c3d" />
    <meta name="description" content="Understand your household's financial trajectory. Explore your plan, inspect the evidence, and make considered changes." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Waypoint · Your financial outlook</title>
    <script>
      try {
        var stored = localStorage.getItem("waypoint-theme") || "system";
        var dark =
          stored === "dark" ||
          (stored === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
