# Daily use: docker compose --env-file .env.dev -f docker-compose.dev.yml up -d --build --wait
# Slots: docker compose --env-file .env.dev.<slot> -f docker-compose.dev.yml up -d --build --wait
# The slot env file sets DEV_PROJECT and DEV_SLOT_STATE_DIR plus free loopback ports.
name: ${DEV_PROJECT:-waypoint-dev}

services:
  casdoor:
    image: casbin/casdoor:v4.23.0@sha256:e13c9aada231f7338a03ab0ae7054d0a9480e77283338ab9fc319d88fe2b3ce0
    user: "${DEV_UID:?Run scripts/dev setup}:${DEV_GID:?Run scripts/dev setup}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_CASDOOR_PORT:-8000}:8000"
    volumes:
      - ${DEV_SLOT_STATE_DIR:-./tmp/dev}/casdoor/conf:/conf:ro
      - ${DEV_SLOT_STATE_DIR:-./tmp/dev}/casdoor/db:/data
      # Casdoor stores its file sessions in ./tmp.
      - ${DEV_SLOT_STATE_DIR:-./tmp/dev}/casdoor/sessions:/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12

  backend:
    image: waypoint-dev-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "${DEV_UID:?Run scripts/dev setup}:${DEV_GID:?Run scripts/dev setup}"
    ports:
      - "127.0.0.1:${DEV_BACKEND_DEBUG_PORT:-8788}:8787"
    volumes:
      - ${DEV_SLOT_STATE_DIR:-./tmp/dev}/data:/data
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      NET_WORTH_ESTIMATOR_DB: /data/net-worth-estimator.db
      NET_WORTH_ESTIMATOR_RECEIPT_SOURCE: mock
      NET_WORTH_ESTIMATOR_ALLOWED_ORIGINS: ${DEV_APP_PUBLIC_URL:?Run scripts/dev setup}
      NET_WORTH_ESTIMATOR_AUTH_PROVIDER: casdoor
      NET_WORTH_ESTIMATOR_AUTH_ISSUER: ${DEV_CASDOOR_PUBLIC_URL:?Run scripts/dev setup}
      NET_WORTH_ESTIMATOR_AUTH_INTERNAL_URL: http://casdoor:8000
      NET_WORTH_ESTIMATOR_AUTH_CLIENT_ID: ${DEV_AUTH_CLIENT_ID:?Run scripts/dev setup}
      NET_WORTH_ESTIMATOR_AUTH_CLIENT_SECRET: ${DEV_AUTH_CLIENT_SECRET:?Run scripts/dev setup}
      NET_WORTH_ESTIMATOR_PUBLIC_URL: ${DEV_APP_PUBLIC_URL:?Run scripts/dev setup}
      NET_WORTH_ESTIMATOR_AUTH_ACCOUNT_URL: ${DEV_CASDOOR_PUBLIC_URL:?Run scripts/dev setup}/account
      NET_WORTH_ESTIMATOR_AUTH_SESSION_LIFETIME: 168h
      NET_WORTH_ESTIMATOR_AUTH_RECHECK_INTERVAL: 30s
      NET_WORTH_ESTIMATOR_AUTH_PERMISSION_MODEL: waypoint/user-access
      # Bridge credential selection uses the verified owner subject.
      NET_WORTH_ESTIMATOR_OWNER_SUBJECT: ${DEV_OWNER_SUBJECT:-}
      # Anonymous traffic resolves to this provisioned guest subject (bootstrap.guest_subject).
      NET_WORTH_ESTIMATOR_GUEST_SUBJECT: ${DEV_GUEST_SUBJECT:-}
      NET_WORTH_ESTIMATOR_READ_ONLY: ""
    depends_on:
      casdoor:
        condition: service_healthy

  frontend:
    image: waypoint-dev-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8787
    ports:
      - "127.0.0.1:${DEV_FRONTEND_PORT:-5178}:80"
    depends_on:
      backend:
        condition: service_healthy
