# Daily use: docker compose --env-file .env.dev.<slot> -f docker-compose.dev.yml up -d --build --wait
name: ${DEV_PROJECT:-waypoint-dev}
services:
  auth:
    image: waypoint-dev-auth
    build:
      context: .
      dockerfile: auth/better-auth/Dockerfile
    user: "${DEV_UID:?Run scripts/dev setup}:${DEV_GID:?Run scripts/dev setup}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_AUTH_PORT:-8000}:8000"
    volumes:
      - ${DEV_SLOT_STATE_DIR:-./tmp/dev}/auth:/data
    environment:
      AUTH_DATABASE: /data/identity.db
      AUTH_PUBLIC_URL: ${DEV_AUTH_PUBLIC_URL:?Run scripts/dev setup}
      APP_PUBLIC_URL: ${DEV_APP_PUBLIC_URL:?Run scripts/dev setup}
      BETTER_AUTH_SECRET: ${DEV_BETTER_AUTH_SECRET:?Run scripts/dev setup}
      AUTH_CLIENT_ID: ${DEV_AUTH_CLIENT_ID:?Run scripts/dev setup}
      AUTH_CLIENT_SECRET: ${DEV_AUTH_CLIENT_SECRET:?Run scripts/dev setup}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  backend:
    image: waypoint-dev-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "${DEV_UID:?Run scripts/dev setup}:${DEV_GID:?Run scripts/dev setup}"
    ports:
      - "127.0.0.1:${DEV_BACKEND_DEBUG_PORT:-8788}:8787"
    volumes:
      - ${DEV_SLOT_STATE_DIR:-./tmp/dev}/data:/data
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      NET_WORTH_ESTIMATOR_DB: /data/net-worth-estimator.db
      NET_WORTH_ESTIMATOR_AUTHZ_DB: /data/authorization.db
      NET_WORTH_ESTIMATOR_RECEIPT_SOURCE: mock
      NET_WORTH_ESTIMATOR_ALLOWED_ORIGINS: ${DEV_APP_PUBLIC_URL:?Run scripts/dev setup}
      NET_WORTH_ESTIMATOR_AUTH_PROVIDER: better-auth
      NET_WORTH_ESTIMATOR_AUTH_ISSUER: ${DEV_AUTH_PUBLIC_URL:?Run scripts/dev setup}
      NET_WORTH_ESTIMATOR_AUTH_INTERNAL_URL: http://auth:8000
      NET_WORTH_ESTIMATOR_AUTH_CLIENT_ID: ${DEV_AUTH_CLIENT_ID:?Run scripts/dev setup}
      NET_WORTH_ESTIMATOR_AUTH_CLIENT_SECRET: ${DEV_AUTH_CLIENT_SECRET:?Run scripts/dev setup}
      NET_WORTH_ESTIMATOR_PUBLIC_URL: ${DEV_APP_PUBLIC_URL:?Run scripts/dev setup}
      NET_WORTH_ESTIMATOR_AUTH_ACCOUNT_URL: ${DEV_AUTH_PUBLIC_URL:?Run scripts/dev setup}/account
      NET_WORTH_ESTIMATOR_AUTH_SESSION_LIFETIME: 168h
      NET_WORTH_ESTIMATOR_AUTH_RECHECK_INTERVAL: 30s
      NET_WORTH_ESTIMATOR_ADMIN_SUBJECT: ${DEV_ADMIN_SUBJECT:-}
      NET_WORTH_ESTIMATOR_GUEST_SUBJECT: ${DEV_GUEST_SUBJECT:?Run scripts/dev setup}
      NET_WORTH_ESTIMATOR_READ_ONLY: ""
    depends_on:
      auth:
        condition: service_healthy
  frontend:
    image: waypoint-dev-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8787
    ports:
      - "127.0.0.1:${DEV_FRONTEND_PORT:-5178}:80"
    depends_on:
      backend:
        condition: service_healthy
