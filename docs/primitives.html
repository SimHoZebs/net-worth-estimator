<title>Net Worth Estimator — Primitive interactions</title>
<!--
  Source of truth: the Go engine and its docs. Every node and edge below

<style>

    <text x="30" y="15" font-size="11">data at rest</text></g>

    <g><rect class="sw sw-code" x="292" y="3" width="22" height="16" rx="4"/>

  <svg id="graph" viewBox="0 0 1280 760" role="img"

<script>

  { f:"checkpoint", t:"replay", l:"corrections", step:5, src:"types.CheckpointCorrection" },
  { f:"posting", t:"replay", l:"history actuals", step:6, src:"domain.replayHistoricalState" },

  { f:"occurrence", t:"resolvers", l:"resolves each amount", step:15, src:"domain.ComputeRequestedAmount" },
  { f:"posting", t:"resolvers", l:"every amount", step:16, src:"domain.ComputeRequestedAmount" },
  { f:"resolvers", t:"runtime", l:"requested", step:17, src:"domain.TransitionRuntime" },
  { f:"occurrence", t:"runtime", l:"executes as posting", step:18, src:"domain.TransitionRuntime" },
  { f:"providers", t:"memory", l:"reads", step:19, src:"types.SimulationState" },
  { f:"runtime", t:"memory", l:"records", step:20, src:"domain.TransitionRuntime" },
  { f:"runtime", t:"events", l:"emits", step:21, src:"types.SimulationRun" },
  { f:"events", t:"evalout", l:"classify", step:22, src:"domain.EvaluateProjectionPath" },
  { f:"evalout", t:"runtime", l:"FI branch runs", step:23, src:"domain/evaluation_fi.go" },
  { f:"events", t:"timing", l:"group", step:24, src:"TimingPreview" },
  { f:"posting", t:"analysis", l:"recorded inflows", step:25, src:"domain.analyzePay" },

const W = 1280, H = 760, LANEW = W / 4, NW = 196, NH = 52, GAP = 16;
const svg = document.getElementById("graph");
const NS = "http://www.w3.org/2000/svg";
const byId = {};
NODES.forEach(n => byId[n.id] = n);
function rootOf(id) {
  let n = byId[id], guard = 0;
  while (n && n.parent && guard++ < 5) n = byId[n.parent];
  return n ? n.id : id;
}
// stack top-level nodes per lane, vertically centered; parents grow to hold kids
const lanes = LANES.map(() => []);
NODES.forEach(n => { if (!n.parent) lanes[n.lane].push(n); });
const pos = {};
const PAD = 10, KIDH = 32;
lanes.forEach((list, li) => {
  const heightOf = n => (n.kids ? n.kids.length * (KIDH + 8) + 40 : n.data && !n.parent ? 56 : 44);
  const total = list.reduce((s, n) => s + heightOf(n) + GAP, -GAP);
  let y = (H - total) / 2 + 24;
  list.forEach(n => {
    const h = heightOf(n);
    pos[n.id] = { x: li * LANEW + (LANEW - NW) / 2, y, h };
    (n.kids || []).forEach((kid, i) => {
      pos[kid] = { x: pos[n.id].x + PAD, y: y + 30 + i * (KIDH + 8), h: KIDH, w: NW - PAD * 2 };
    });
    y += h + GAP;
  });
});
LANES.forEach((name, i) => {
  const t = document.createElementNS(NS, "text");
  t.setAttribute("x", i * LANEW + 18); t.setAttribute("y", 30);
  t.setAttribute("class", "lane-label"); t.textContent = (i + 1) + " · " + name.toUpperCase();
  svg.appendChild(t);
});
function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e); return e;
}
el("defs", {}).innerHTML =
  '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" ' +
  'markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z"/></marker>';
function laneOf(id) { const n = byId[id]; return n ? n.lane : 0; }
function ancestors(id) {
  const chain = [];
  let n = byId[id];
  while (n && n.parent) { chain.push(n.parent); n = byId[n.parent]; }
  return chain;
}
function descendants(id) {
  const out = [];
  NODES.forEach(n => {
    let p = n.parent;
    while (p) { if (p === id) { out.push(n.id); break; } p = byId[p] ? byId[p].parent : null; }
  });

}
// Rounded-corner polyline through pts.
function roundedPath(pts, r) {
  const f = v => Math.round(v * 10) / 10;
  let d = `M ${f(pts[0][0])} ${f(pts[0][1])}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    const l1 = Math.hypot(x1 - x0, y1 - y0), l2 = Math.hypot(x2 - x1, y2 - y1);
    if (!l1 || !l2) { d += ` L ${f(x1)} ${f(y1)}`; continue; }
    const rr = Math.min(r, l1 / 2, l2 / 2);
    const ax = x1 - (x1 - x0) / l1 * rr, ay = y1 - (y1 - y0) / l1 * rr;
    const bx = x1 + (x2 - x1) / l2 * rr, by = y1 + (y2 - y1) / l2 * rr;
    d += ` L ${f(ax)} ${f(ay)} Q ${f(x1)} ${f(y1)} ${f(bx)} ${f(by)}`;

// True when the default curve would hide behind an unrelated box. The

// descendants never count.
function curveHits(f, t, x1, y1, mx, x2, y2) {
  const ignore = new Set([f, t, ...ancestors(f), ...ancestors(t), ...descendants(f), ...descendants(t)]);
  const boxes = Object.keys(pos).map(id => {
    const p = pos[id];
    return { id, x: p.x, y: p.y, w: p.w || NW, h: p.h || NH };
  });
  const at = tt => {
    const u = 1 - tt;
    return [
      u * u * u * x1 + 3 * u * u * tt * mx + 3 * u * tt * tt * mx + tt * tt * tt * x2,
      u * u * u * y1 + 3 * u * u * tt * y1 + 3 * u * tt * tt * y2 + tt * tt * tt * y2,
    ];
  };
  for (let i = 1; i < 20; i++) {
    const [x, y] = at(i / 20);
    for (const b of boxes) {
      if (!ignore.has(b.id) && x > b.x + 2 && x < b.x + b.w - 2 && y > b.y + 2 && y < b.y + b.h - 2)

    }
  }
  return false;
}
// Layout invariant the fallbacks rely on: nodes are NW wide centered in

// cannot pass behind a component.
const busTop = Math.max(56, Math.min(...lanes.flat().map(n => pos[n.id].y)) - 40);

const corridorCount = {};

  const a = pos[e.f], b = pos[e.t];
  const aw = a.w || NW, ah = a.h || NH, bw = b.w || NW, bh = b.h || NH;

    // re-enter the target's right edge, clearing stacked siblings. Applies
    // to kids too: the final strip is their own container entry.

    corridorCount[lane] = (corridorCount[lane] || 0) + 1;
    d = roundedPath([[x1, y1], [cx, y1], [cx, y2], [b.x + bw + 4, y2]], 10);
  } else if (curveHits(e.f, e.t, x1, y1, (x1 + x2) / 2, x2, y2)) {

// Place each label on the on-curve slot farthest from labels placed

{

const nodeEls = {};

  }
  const tip = el("title", {}, g);
  tip.textContent = n.label + " — " + (n.sub || n.label) + (n.src ? " — " + n.src : "");
  nodeEls[n.id] = g;
  g.addEventListener("mouseenter", () => focus(n.id, true));
  g.addEventListener("mouseleave", () => focus(n.id, false));
});
// Edges paint above nodes: the router guarantees no unrelated crossings,
// so arrowheads and labels never bury under a box.
svg.querySelectorAll(".edge, .edge-label").forEach(n => svg.appendChild(n));
function focus(id, on) {
  const linked = new Set([id]);
  const self = byId[id];
  if (self.parent) {
    linked.add(self.parent);
    NODES.forEach(n => { if (n.parent === self.parent) linked.add(n.id); });
  }
  if (self.kids) self.kids.forEach(k => linked.add(k));
  EDGES.forEach(e => { if (e.f === id) linked.add(e.t); if (e.t === id) linked.add(e.f); });
  const roots = new Set([...linked].map(rootOf));
  // Keep only flows directly touching the hovered node, plus edges fully
  // inside one linked group (e.g. runtime -> memory under the engine).
  // A neighbor's other flows stay dim: hovering Posting shows its own
  // outflows, not its neighbors'.
  const keepEdge = (f, t) => f === id || t === id ||
    (linked.has(f) && linked.has(t) && roots.has(rootOf(f)) && rootOf(f) === rootOf(t));
  NODES.forEach(n => nodeEls[n.id].classList.toggle("dim", on && !linked.has(n.id)));
  svg.querySelectorAll(".edge").forEach(p =>
    p.classList.toggle("dim", on && !keepEdge(p.dataset.f, p.dataset.t)));
  svg.querySelectorAll(".edge").forEach(p =>
    p.classList.toggle("hot", on && keepEdge(p.dataset.f, p.dataset.t)));
  svg.querySelectorAll(".edge-label").forEach(l =>
    l.classList.toggle("dim", on && !keepEdge(l.dataset.f, l.dataset.t)));
}
</script>
</body>
</html>
